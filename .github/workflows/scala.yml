name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
        cache: sbt   # <- GitHub cached automatisch, kein eigener Cache nötig!

    - name: Run tests
      run: sbt test

    - name: Run coverage
      run: sbt coverage test coverageReport